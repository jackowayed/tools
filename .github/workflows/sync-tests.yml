name: Sync tests

on:
  push:
    paths:
      - 'baby-weight.html'
      - 'sync-*.js'
      - 'worker/**'
      - 'migrations/**'
      - 'tests/**'
      - 'package*.json'
      - 'wrangler.jsonc'
      - '.github/workflows/sync-tests.yml'
  pull_request:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx wrangler deploy --dry-run
