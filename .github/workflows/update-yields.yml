name: Update cash yields

on:
  schedule:
    # Daily at 12:00 UTC (early morning US). U.S. markets and Treasury data
    # publish on weekdays; a daily run keeps the file fresh with little cost.
    - cron: "0 12 * * *"
  workflow_dispatch:

# Don't let two refreshes race on the same file.
concurrency:
  group: update-yields
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch yields
        run: python3 fetch_yields.py

      - name: Commit updated data
        run: |
          if git diff --quiet -- cash-yields.json; then
            echo "No change in cash-yields.json."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cash-yields.json
          git commit -m "Update cash yields"
          git push
